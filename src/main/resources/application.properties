# ===========================================
# Portfolio Application Configuration
# ===========================================
# All values can be overridden via environment variables
# Use .env file for local development
# Set environment variables in production (Render, etc.)
# ===========================================

# Application info
spring.application.name=Portfolio API
spring.application.version=1.0.0

# JSON data store. The bundled resume.json seeds this writable runtime file.
portfolio.data.path=${PORTFOLIO_DATA_PATH:./data/portfolio.json}

# Single environment-backed administrator
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin}
admin.email=${ADMIN_EMAIL:}
admin.phone=${ADMIN_PHONE:}

# ===========================================
# JWT Configuration
# ===========================================
jwt.secret=${JWT_SECRET:local-dev-secret-key-a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===========================================
# CORS Configuration
# ===========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}

# ===========================================
# Server Configuration
# ===========================================
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ===========================================
# Logging Configuration
# ===========================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.bgv.portfolio=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}

# ===========================================
# Jackson Configuration
# ===========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
