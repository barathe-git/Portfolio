# Render Blueprint - database-free portfolio backend
# Deploy: https://dashboard.render.com/blueprints

services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    healthCheckPath: /api/profile
    envVars:
      - key: PORTFOLIO_DATA_PATH
        value: /app/data/portfolio.json
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: ""
      - key: ADMIN_PHONE
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      # CORS - Set manually after Vercel deployment
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL_ROOT
        value: WARN
      - key: LOG_LEVEL_APP
        value: INFO
      - key: LOG_LEVEL_SECURITY
        value: WARN
